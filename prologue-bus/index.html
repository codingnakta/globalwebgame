<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>버스 출근길</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@latest/dist/galmuri.css">
<style>
  :root {
    --bg: #141C2A;
    --speed: 24s;          /* 배경 한 바퀴(두 장 폭) 도는 시간. 클수록 느림 */
    --bob: 6px;            /* 버스 흔들림 폭 */
    --zoom: 1.1;           /* 전경(버스 안) 확대 배율 */
    --lift: -4%;           /* 전경을 위로 올리는 양 (음수일수록 위로) */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); overflow: hidden; font-family: system-ui, sans-serif; }

  /* 16:9 게임 화면 */
  .stage {
    position: absolute; inset: 0; margin: auto;
    width: 100vw; height: 56.25vw;
    max-height: 100vh; max-width: 177.78vh;
    overflow: hidden; background: #9fd3ff;
  }

  /* ── 배경: 도시 거리, 오른쪽→왼쪽 ── */
  .city {
    position: absolute; inset: 0;
    display: flex; height: 100%;
    animation: scroll var(--speed) linear infinite;
    will-change: transform;
  }
  .city img {
    height: 100%; width: auto; flex: none;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    user-select: none; -webkit-user-drag: none;
  }
  /* 두 번째 장은 좌우 반전 → 이음새가 자연스럽게 이어짐 */
  .city img:nth-child(2) { transform: scaleX(-1); }
  @keyframes scroll {
    from { transform: translate3d(0, 0, 0); }
    to   { transform: translate3d(-50%, 0, 0); }
  }

  /* ── 전경: 버스 안 소녀 (흰 배경은 캔버스에서 투명 처리) ── */
  .bus {
    position: absolute; inset: 0;
    display: flex; align-items: flex-end; justify-content: center;
    animation: bob 1.1s ease-in-out infinite;
    pointer-events: none;
  }
  /* 배경도 반대 위상으로 살짝 흔들려 덜컹거림 강조 */
  .city { animation: scroll var(--speed) linear infinite, bgbob 1.1s ease-in-out infinite; }
  @keyframes bgbob {
    0%, 100% { margin-top: 0; }
    50%      { margin-top: calc(var(--bob) * -0.4); }
  }
  .bus canvas {
    width: 100%; height: 100%;
    object-fit: cover;               /* 원본 비율 유지, 가로를 꽉 채움 */
    object-position: center top;     /* 윗부분(하차 벨·손잡이)을 온전히 보이게, 무릎 아래만 잘림 */
    transform: translateY(var(--lift)) scale(var(--zoom));   /* 살짝 위로 올리고 확대 */
    transform-origin: 50% 0%;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }
  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    30%      { transform: translateY(var(--bob)); }
    55%      { transform: translateY(calc(var(--bob) * 0.3)); }
    75%      { transform: translateY(calc(var(--bob) * 0.8)); }
  }

  /* 창밖 햇빛 느낌을 위한 아주 옅은 톤 */
  .haze { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,0) 40%); pointer-events: none; }

  /* ── 상단 라벨 (기획서 공통 UI 미리보기) ── */
  .hud {
    position: absolute; top: 2.5%; left: 3%; right: 3%;
    display: flex; justify-content: space-between;
    color: #F3F5FA; font-size: clamp(14px, 1.6vw, 28px);
    text-shadow: 0 2px 0 #141C2A, 0 0 6px rgba(0,0,0,.6);
    letter-spacing: .04em;
  }

  /* ── 이미지 없을 때 안내 / 드롭존 ── */
  .hint {
    position: absolute; inset: 0; display: grid; place-items: center;
    background: rgba(20,28,42,.85); color: #F3F5FA; text-align: center;
    font-size: clamp(14px, 1.4vw, 22px); line-height: 1.7; padding: 24px;
  }
  .hint code { background: #202A3A; padding: 2px 8px; border-radius: 4px; color: #B4C6ED; }
  .hint.hidden { display: none; }
  .stage.dragover { outline: 6px dashed #8CE0AE; outline-offset: -6px; }

  /* ── RPG 대화창 ── */
  .dlg {
    --px: 3px;                            /* 픽셀 한 칸 크기(테두리 선 두께) */
    --r: 7;                               /* 모서리 반지름(픽셀 칸 수). 클수록 둥글게 */
    position: absolute; left: 5%; right: 5%; bottom: 6%;
    height: 22%; box-sizing: border-box; overflow: hidden;   /* 높이 고정: 대사 길이와 무관 */
    /* 테두리는 JS가 픽셀 원 알고리즘으로 그린 9-slice 이미지(border-image)로 그림 */
    border: calc(var(--px) * (var(--r) + 2)) solid transparent;
    border-radius: 0;
    background: none;                     /* 안쪽 채움(검정 70%)도 border-image가 담당 */
    padding: clamp(6px, .8vw, 14px) clamp(10px, 1.4vw, 22px);
    image-rendering: pixelated;
    color: #F3F5FA;
    font-family: 'Galmuri11', 'Galmuri9', system-ui, sans-serif;
    font-size: clamp(18px, 2.2vw, 34px);
    line-height: 1.6;
    cursor: pointer; z-index: 4;
    user-select: none;
  }
  /* 화자 이름: name이 있는 줄에서만 대사 위에 작게 표시 (전화 상대 등) */
  .dlg .name {
    display: block; font-size: .6em; line-height: 1.3;
    color: #B4C6ED; letter-spacing: .04em; margin-bottom: .1em;
  }
  .dlg .name:empty { display: none; }
  .dlg .text { white-space: pre-wrap; word-break: keep-all; }
  .dlg.inner .text { color: #B9BEC8; }    /* 속마음 = 회색 글씨 */
  .dlg .next {
    position: absolute; right: 1.2em; bottom: .6em;
    font-size: .8em; animation: blink 1s steps(2) infinite;
    visibility: hidden;
  }
  .dlg.done .next { visibility: visible; }
  .dlg.gone { display: none; }            /* 이벤트 장면에서 대화창 통째로 숨김 */
  @keyframes blink { to { opacity: 0; } }

  /* ── 학교 정문 장면 + 암전 전환 ── */
  .gate {
    position: absolute; inset: 0; display: none;
    background: #141C2A;
  }
  .gate img {
    width: 100%; height: 100%; object-fit: cover;
    image-rendering: pixelated; image-rendering: crisp-edges;
  }
  /* 정문 앞 소녀 뒷모습: 화면 아래 중앙, 등장 시 살짝 떠오르며 페이드 인 */
  .gate canvas {
    position: absolute; left: 0; right: 0; bottom: 0;
    width: 100%; height: 88%;
    object-fit: contain; object-position: center bottom;
    image-rendering: pixelated; image-rendering: crisp-edges;
    opacity: 0; transform: translateY(3%);
    transition: opacity .7s ease, transform .7s ease;
  }
  .gate canvas.show { opacity: 1; transform: translateY(0); }
  .stage.at-gate .gate { display: block; }
  .stage.at-gate .city, .stage.at-gate .bus, .stage.at-gate .haze { display: none; }
  .fade {
    position: absolute; inset: 0; background: #000; opacity: 0;
    pointer-events: none; transition: opacity .6s ease; z-index: 6;
  }
  .fade.on { opacity: 1; }

  /* ── 전화 수신 화면 (받기 / 거절 선택) ── */
  .phone { position: absolute; inset: 0; display: none; background: rgba(0,0,0,.55); z-index: 5; }
  .phone.on { display: block; }
  .phone .wrap {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    height: 94%; aspect-ratio: 941 / 1672;
    animation: phoneIn .35s ease;
  }
  .phone .wrap img {
    width: 100%; height: 100%; display: block;
    image-rendering: pixelated; image-rendering: crisp-edges;
    animation: wiggle .45s ease-in-out infinite;     /* 벨 울리는 동안 살짝 흔들림 */
  }
  /* 이미지 속 버튼 위에 얹는 투명 클릭 영역 (이미지 기준 % 좌표) */
  .phone .hot {
    position: absolute; width: 22%; height: 13%; border: none; background: transparent;
    cursor: pointer; border-radius: 50%; padding: 0;
  }
  .phone .hot:focus-visible { outline: none; }
  .phone .hot.reject { left: 19.5%; top: 75%; }
  .phone .hot.accept { left: 59.5%; top: 75%; }
  @keyframes phoneIn { from { opacity: 0; transform: translate(-50%, -44%); } to { opacity: 1; transform: translate(-50%, -50%); } }
  @keyframes wiggle { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-1.2deg); } 75% { transform: rotate(1.2deg); } }

  /* ── 사운드 버튼 ── */
  .snd {
    position: absolute; right: 2%; top: 3%;
    width: clamp(36px, 3.4vw, 56px); height: clamp(36px, 3.4vw, 56px);
    border: 3px solid #F3F5FA; background: rgba(20,28,42,.75); color: #F3F5FA;
    font-size: clamp(16px, 1.6vw, 26px); cursor: pointer; border-radius: 6px;
    display: grid; place-items: center; z-index: 5;
    box-shadow: 0 3px 0 #141C2A;
  }
  .snd:hover { background: #202A3A; }

  /* OS의 '애니메이션 줄이기' 설정과 무관하게 항상 흔들림/스크롤 유지 (교사가 직접 연출하는 화면이므로) */
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="city" id="city">
    <img id="city1" alt="">
    <img id="city2" alt="">
  </div>
  <div class="haze"></div>
  <div class="bus"><canvas id="busCanvas"></canvas></div>
  <div class="gate">
    <img src="assets/school-gate.png" alt="" onerror="this.style.display='none'">
    <canvas id="gateGirl"></canvas>
  </div>
  <div class="phone" id="phone">
    <div class="wrap">
      <img src="assets/phone-call.png" alt="" onerror="this.style.display='none'">
      <button class="hot reject" id="btnReject" aria-label="거절" title="거절"></button>
      <button class="hot accept" id="btnAccept" aria-label="응답" title="응답"></button>
    </div>
  </div>
  <div class="fade" id="fade"></div>
  <div class="dlg" id="dlg">
    <span class="name" id="dlgName"></span>
    <div class="text" id="dlgText"></div>
    <span class="next">▼</span>
  </div>
  <audio id="bgm" src="assets/bus-stop.wav" loop preload="auto"></audio>
  <audio id="music" src="assets/kafka-on-the-shore.mp3" loop preload="auto"></audio>
  <audio id="announce" src="assets/bus-announce.mp3" preload="auto"></audio>
  <audio id="ring" src="assets/reflection.mp3" loop preload="auto"></audio>
  <button class="snd" id="sndBtn" title="소리 켜기/끄기" aria-label="소리 켜기/끄기">🔇</button>

  <div class="hint" id="hint">
    <div>
      <p><b>이미지 2장을 이 화면에 드래그&amp;드롭</b>하거나<br>
      아래 경로에 저장한 뒤 새로고침하세요.</p>
      <p style="margin-top:12px">
        배경(도시 거리) → <code>assets/city-street.png</code><br>
        전경(버스 안 소녀) → <code>assets/bus-girl.png</code>
      </p>
      <p style="margin-top:12px;opacity:.7">가로로 긴 쪽을 배경으로 자동 판별합니다.</p>
    </div>
  </div>
</div>

<script>
(() => {
  const stage = document.getElementById('stage');
  const hint  = document.getElementById('hint');
  const city1 = document.getElementById('city1');
  const city2 = document.getElementById('city2');
  const canvas = document.getElementById('busCanvas');
  const ctx = canvas.getContext('2d');

  const state = { city: false, bus: false };
  const updateHint = () => hint.classList.toggle('hidden', state.city && state.bus);

  // ── 배경 적용 ──
  function setCity(src) {
    city1.src = src; city2.src = src;
    state.city = true; updateHint();
  }

  // ── 전경 스프라이트: 가장자리에서 이어진 흰색만 투명 처리 (flood fill) ──
  const sprites = {};                       // { default, surprised } → 투명 처리된 캔버스
  function drawBus(c) {
    canvas.width = c.width; canvas.height = c.height;
    ctx.drawImage(c, 0, 0);
    state.bus = true; updateHint();
  }
  function setBus(img) { sprites.default = keyOutWhite(img); drawBus(sprites.default); }
  function keyOutWhite(img) {
    const w = img.naturalWidth, h = img.naturalHeight;
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const ctx = c.getContext('2d');
    ctx.drawImage(img, 0, 0);
    let data;
    try { data = ctx.getImageData(0, 0, w, h); }
    catch (e) { console.warn('캔버스 접근 불가(file:// 등). 흰 배경 유지:', e); return c; }

    const px = data.data;
    const TH = 235;                     // 이 값 이상 밝은 픽셀을 '흰색'으로 간주
    const isWhite = i => px[i] >= TH && px[i+1] >= TH && px[i+2] >= TH;
    const seen = new Uint8Array(w * h);
    const stack = [];
    const push = (x, y) => { const k = y*w + x; if (!seen[k]) { seen[k] = 1; stack.push(k); } };
    for (let x = 0; x < w; x++) { push(x, 0); push(x, h-1); }
    for (let y = 0; y < h; y++) { push(0, y); push(w-1, y); }

    while (stack.length) {
      const k = stack.pop();
      const i = k * 4;
      if (!isWhite(i)) continue;
      px[i+3] = 0;
      const x = k % w, y = (k - x) / w;
      if (x > 0)   push(x-1, y);
      if (x < w-1) push(x+1, y);
      if (y > 0)   push(x, y-1);
      if (y < h-1) push(x, y+1);
    }
    ctx.putImageData(data, 0, 0);
    return c;
  }

  function loadImage(src) {
    return new Promise((res, rej) => {
      const im = new Image();
      im.onload = () => res(im); im.onerror = rej; im.src = src;
    });
  }

  // ── 기본 경로에서 시도 (없어도 멈추지 않음) ──
  loadImage('assets/city-street.png').then(im => setCity(im.src)).catch(() => {});
  loadImage('assets/bus-girl.png').then(setBus).catch(() => {});
  loadImage('assets/bus-girl-surprised.png').then(im => { sprites.surprised = keyOutWhite(im); }).catch(() => {});
  loadImage('assets/girl-back.png').then(im => { sprites.back = keyOutWhite(im); }).catch(() => {});

  // ── 배경음: 첫 클릭/키 입력 후 재생, 버튼으로 음소거 토글 ──
  const bgm = document.getElementById('bgm');       // 버스 안 환경음 (내리면 멈춤)
  const music = document.getElementById('music');   // 배경 음악 (장면 바뀌어도 계속)
  const sndBtn = document.getElementById('sndBtn');
  const BGM_VOL = 0.5, MUSIC_VOL = 0.2;             // 기본 볼륨
  const DUCK = 0.3;                                  // 방송·벨소리 동안 배경음 줄이는 비율
  bgm.volume = BGM_VOL; music.volume = MUSIC_VOL;
  let muted = false;
  let offBus = false;                                // 버스에서 내렸으면 true → 버스 환경음 안 켬
  const renderSnd = () => { sndBtn.textContent = (muted || music.paused) ? '🔇' : '🔊'; };
  const playBg = () => {
    if (!offBus) bgm.play().catch(() => {});        // 파일이 없거나 차단돼도 멈추지 않음
    music.play().then(renderSnd).catch(() => {});
  };
  const duck = on => {                               // 방송·벨소리 동안 배경음 낮추기
    bgm.volume = on ? BGM_VOL * DUCK : BGM_VOL;
    music.volume = on ? MUSIC_VOL * DUCK : MUSIC_VOL;
  };
  const startAudio = () => {
    if (muted || !music.paused) return;
    playBg();
  };
  sndBtn.addEventListener('click', e => {
    e.stopPropagation();
    muted = !muted;
    if (muted) { bgm.pause(); music.pause(); announce.pause(); ring.pause(); } else playBg();
    renderSnd();
  });
  bgm.addEventListener('error', () => { sndBtn.title = '배경음 파일을 찾을 수 없습니다'; });
  stage.addEventListener('pointerdown', startAudio);
  window.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') startAudio(); });

  // ── 픽셀 대화창 테두리 생성 (픽셀 원 알고리즘으로 계단식 둥근 모서리) ──
  function buildPixelFrame(el) {
    const cs = getComputedStyle(el);
    const R = parseInt(cs.getPropertyValue('--r')) || 7;    // 모서리 반지름(칸)
    const S = R + 2;                                         // 슬라이스 크기 = 반지름 + 테두리 2칸(흰선+바깥선)
    const T = S * 2 + 2;                                     // 타일 전체 크기(가운데 2칸은 늘어남)
    const c = document.createElement('canvas'); c.width = c.height = T;
    const g = c.getContext('2d');
    // inset 칸 안쪽으로 반지름 r인 둥근 사각형에 픽셀 중심이 들어가는지
    const inside = (x, y, inset, r) => {
      const px = x + .5, py = y + .5, lo = inset + r, hi = T - inset - r;
      const dx = Math.max(lo - px, px - hi, 0), dy = Math.max(lo - py, py - hi, 0);
      return px >= inset && px <= T - inset && py >= inset && py <= T - inset && dx*dx + dy*dy <= r*r;
    };
    for (let y = 0; y < T; y++) for (let x = 0; x < T; x++) {
      let col = null;
      if (inside(x, y, 2, R))          col = 'rgba(0,0,0,0.7)';   // 안쪽 채움
      else if (inside(x, y, 1, R + 1)) col = '#F3F5FA';           // 흰 선
      else if (inside(x, y, 0, R + 2)) col = '#141C2A';           // 바깥 어두운 선
      if (col) { g.fillStyle = col; g.fillRect(x, y, 1, 1); }
    }
    el.style.borderImage = `url(${c.toDataURL()}) ${S} fill / calc(var(--px) * ${S}) stretch`;
  }
  buildPixelFrame(document.getElementById('dlg'));

  // ── 대사 (여기만 바꾸면 됩니다) ──
  // inner: true → 속마음(회색 글씨), 없으면 일반 대사(흰 글씨)
  // event: 'announce' → 놀란 표정 + 안내 방송,  hide: true → 대화창 숨김
  const LINES = [
    { inner: true, text: '에휴.. 난 언제쯤 취업하려나...' },
    { inner: true, text: '학교 가기 싫다. 다들 취업했는데' },
    { inner: true, text: '난 뭐가 문제인걸까..' },
    { event: 'announce', hide: true, text: '' },
    { text: '내려야겠다!' },
    { event: 'gate', hide: true, text: '' },       // 암전 → 학교 정문
    { event: 'girlBack', hide: true, text: '', autoNext: 1200 },   // 소녀 뒷모습 등장 → 1.2초 뒤 자동 진행
    { inner: true, text: '아… 들어가기 싫어.' },
    { ring: true, inner: true, text: '응? 이 아침에 누구지?' },   // ring: true → 벨소리 울림 (다음 줄에서 멈춤)
    { id: 'phone', event: 'phone', ring: true, hide: true, text: '' },          // 전화 화면: 응답/거절 선택
    { id: 'rejected', inner: true, text: '아… 받아야 될 것 같아.', next: 'phone' }, // 거절 → 이 대사 뒤 다시 전화 화면
    { id: 'answered', text: '여보세요?' },                                       // 응답 → 통화 시작
    { name: '황민현', text: '응 미림아' },                                      // name → 대사 위에 화자 이름 작게 표시 (전화 상대)
    { name: '황민현', text: '오늘 학교 오지?' },
    { text: '응… 지금 정문이야.' },
    { name: '황민현', text: '다연쌤이 교무실로 빨리 오라시네' },
    { text: '왜지...?' },
    { name: '황민현', text: '모르지 뭐.. 우리 둘 만 취업 못해서 그런가?' },
    { text: '그런 우울한 얘기는 하지 말자.. 알겠어 바로 올라갈게!' },
  ];
  const idxOf = id => LINES.findIndex(l => l.id === id);

  // ── 벨소리 (전화) ──
  const ring = document.getElementById('ring');
  ring.volume = 0.7;
  function setRing(on) {
    if (on) {
      if (muted) return;
      duck(true);                                             // 벨소리 동안 배경음 줄이기
      if (ring.paused) { ring.currentTime = 0; ring.play().catch(() => {}); }   // 이미 울리는 중이면 이어서
    } else if (!ring.paused) {
      ring.pause(); ring.currentTime = 0;
      duck(false);
    }
  }

  // ── 장면 이벤트 ──
  const announce = document.getElementById('announce');
  const EVENTS = {
    announce() {
      if (sprites.surprised) drawBus(sprites.surprised);      // 놀란 표정으로 교체
      if (muted) return;
      duck(true);                                             // 방송 동안 배경음 줄이기
      announce.currentTime = 0;
      announce.play().catch(() => {});
      announce.onended = () => { duck(false); };
    },
    gate() {
      const fade = document.getElementById('fade');
      transitioning = true;                                   // 전환 중 클릭 무시
      fade.classList.add('on');                               // 암전
      offBus = true;                                          // 내린 뒤엔 버스 환경음 다시 안 켬
      if (!announce.paused) { announce.pause(); announce.currentTime = 0; }   // 안내 방송 중이면 끊기
      duck(false);                                            // 방송 덕킹 해제 (음악 원래 볼륨으로)
      const fadeOut = setInterval(() => {                     // 암전 동안 버스 환경음 서서히 줄이기
        bgm.volume = Math.max(0, bgm.volume - 0.05);
        if (bgm.volume <= 0) { clearInterval(fadeOut); bgm.pause(); }
      }, 60);
      setTimeout(() => {
        stage.classList.add('at-gate');                       // 버스 → 정문으로 교체
        fade.classList.remove('on');                          // 밝아짐
        setTimeout(() => { transitioning = false; }, 600);
      }, 700);
    },
    phone() {
      choosing = true;                                        // 버튼을 누를 때까지 클릭/키 진행 차단
      document.getElementById('phone').classList.add('on');
    },
    girlBack() {
      const c = document.getElementById('gateGirl');
      if (sprites.back) { c.width = sprites.back.width; c.height = sprites.back.height; c.getContext('2d').drawImage(sprites.back, 0, 0); }
      requestAnimationFrame(() => c.classList.add('show'));   // 페이드 인
    },
  };
  const TYPE_MS = 45;   // 글자당 타이핑 속도(ms). 0이면 즉시 표시

  const dlg = document.getElementById('dlg');
  const dlgName = document.getElementById('dlgName');
  const dlgText = document.getElementById('dlgText');
  let lineIdx = 0, typeTimer = null, typed = 0;

  function showLine(i) {
    const L = LINES[i]; if (!L) return;
    clearInterval(typeTimer); typed = 0;
    dlgName.textContent = L.name || ''; dlgText.textContent = '';
    dlg.classList.remove('done');
    dlg.classList.toggle('inner', !!L.inner);
    dlg.classList.toggle('gone', !!L.hide);
    if (L.event && EVENTS[L.event]) EVENTS[L.event]();
    setRing(!!L.ring);                                  // 벨소리: ring: true 인 줄에서만 울림
    if (L.autoNext) {                                   // 지정 시간 뒤 자동으로 다음 줄 (그 사이 클릭하면 그냥 넘어감)
      setTimeout(() => { if (lineIdx === i && i < LINES.length - 1) { lineIdx++; showLine(lineIdx); } }, L.autoNext);
    }
    if (!TYPE_MS || !L.text) { dlgText.textContent = L.text; dlg.classList.add('done'); return; }
    typeTimer = setInterval(() => {
      typed++; dlgText.textContent = L.text.slice(0, typed);
      if (typed >= L.text.length) { clearInterval(typeTimer); dlg.classList.add('done'); }
    }, TYPE_MS);
  }
  function advance() {
    const L = LINES[lineIdx]; if (!L) return;
    if (!dlg.classList.contains('done')) {           // 타이핑 중 → 즉시 완성
      clearInterval(typeTimer); dlgText.textContent = L.text; dlg.classList.add('done'); return;
    }
    if (L.next) { lineIdx = idxOf(L.next); showLine(lineIdx); return; }   // 지정된 줄로 점프
    if (lineIdx < LINES.length - 1) { lineIdx++; showLine(lineIdx); }  // 마지막 줄에선 멈춤
  }
  let lock = false, transitioning = false, choosing = false;   // 중복 입력 방지 / 장면 전환 중 / 선택 대기 중
  const tryAdvance = () => { if (lock || transitioning || choosing) return; lock = true; advance(); setTimeout(() => lock = false, 120); };

  // ── 전화 받기 / 거절 ──
  const phoneEl = document.getElementById('phone');
  function choose(id) {
    choosing = false; phoneEl.classList.remove('on');
    lineIdx = idxOf(id); showLine(lineIdx);
  }
  document.getElementById('btnReject').addEventListener('click', e => { e.stopPropagation(); choose('rejected'); });
  document.getElementById('btnAccept').addEventListener('click', e => { e.stopPropagation(); choose('answered'); });
  stage.addEventListener('click', e => { if (e.target.closest('.snd')) return; tryAdvance(); });
  window.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); tryAdvance(); }
  });
  showLine(0);

  // ── 드래그&드롭으로 즉시 테스트 ──
  ['dragenter','dragover'].forEach(ev => stage.addEventListener(ev, e => { e.preventDefault(); stage.classList.add('dragover'); }));
  ['dragleave','drop'].forEach(ev => stage.addEventListener(ev, e => { e.preventDefault(); stage.classList.remove('dragover'); }));
  stage.addEventListener('drop', async e => {
    for (const f of e.dataTransfer.files) {
      if (!f.type.startsWith('image/')) continue;
      const im = await loadImage(URL.createObjectURL(f));
      const ratio = im.naturalWidth / im.naturalHeight;
      if (ratio > 2) setCity(im.src); else setBus(im);
    }
  });
})();
</script>
</body>
</html>
